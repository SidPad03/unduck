# filters, on a Linux runner so macOS runner capacity is not a variable.
# If this does not fire on a push, the problem is not workflow syntax.
on: push

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: echo "push trigger fired for ${{ github.ref }}"
