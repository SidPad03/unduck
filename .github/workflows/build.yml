name: Build

# Fast compile check on every push and PR. The release pipeline lives in
# release.yml and only runs on tags.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # A SwiftUI + CoreAudio app can only be built on macOS - the Apple frameworks
    # live in the macOS SDK. Pinned rather than macos-latest so a runner rollover
    # can't silently change the SDK under us.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build (release)
        run: swift build -c release

      # Buffer-list geometry and the DSP core, checked against the device layouts
      # that actually ship (2ch interleaved, 8ch interleaved, planar, mono).
      # Needs a full Xcode for the test frameworks, not just the command-line tools.
      - name: Test
        run: swift test

      - name: Assemble the .app and .pkg
        run: bash scripts/package.sh
