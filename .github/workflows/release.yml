name: Release

# Every push to main that changes the app releases it, with nothing done by hand:
# the next version is worked out here, then the .app, .pkg and .dmg are built,
# signed with the Developer ID, notarized, published as a GitHub Release (which
# creates the tag), and the Homebrew cask is pointed at it.
#
# Versions: the next patch after the newest v* tag (0.1.8 -> 0.1.9). To jump to
# a new minor or major, write it to VERSION and push; a VERSION newer than the
# newest tag is used as-is. The Actions tab can also run this with an explicit
# version.
#
# Only changes that alter the shipped app trigger it, so a README edit or a test
# change does not put an update prompt in front of every user.
on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Package.swift"
      - "Package.resolved"
      - "Resources/**"
      - "VERSION"
      - "scripts/package.sh"
      - "scripts/build-dmg.sh"
      - "scripts/lib.sh"
      - "scripts/build-icon.sh"
      - "scripts/make-icon.swift"
      - "scripts/make-dmg-bg.swift"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v. Empty = the next patch."
        required: false

permissions:
  contents: write   # required to create the release and upload assets

# One release at a time, queued rather than cancelled: two quick pushes must
# not both compute the same next version, and a cancelled run could leave a
# notarized build unpublished.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    # Job level so the steps' `if:` can see them; a step's own `env:` is not in
    # scope for that step's `if:`.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      TAP_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}

    steps:
      - uses: actions/checkout@v4

      # The tag, the bundle's CFBundleShortVersionString and the release must all
      # agree, or the in-app updater offers an update the user already has,
      # forever. So the version is decided once, here, and handed to the build.
      - name: Resolve version
        id: v
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          LATEST="$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/v||' | sort -V | tail -1)"
          FILE="$(tr -d '[:space:]' < VERSION)"
          if [ -n "$REQUESTED" ]; then
            VERSION="$REQUESTED"
          elif [ -z "$LATEST" ]; then
            VERSION="$FILE"
          elif [ "$FILE" != "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$FILE" | sort -V | tail -1)" = "$FILE" ]; then
            VERSION="$FILE"
          else
            IFS=. read -r MAJOR MINOR PATCH <<<"$LATEST"
            VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::v$VERSION already exists; set VERSION or pass a version to release something newer."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "Newest tag: v${LATEST:-none}, VERSION file: $FILE -> releasing $VERSION"

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      # A release goes out on every qualifying push, so the tests gate it here
      # rather than only reporting in build.yml alongside.
      - name: Test
        run: swift test

      # APPLE_CERTIFICATE is a base64 .p12 holding both the Developer ID
      # Application identity (the app, the DMG) and the Developer ID Installer
      # identity (the .pkg). Without it the release is ad-hoc signed as before.
      - name: Import the Developer ID certificates
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/pkgbuild
          # The G2 intermediate that issued both certificates. A runner image is
          # not guaranteed to carry it, and without it codesign cannot build the
          # chain to Apple's root.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v "$KEYCHAIN"

      # build-dmg.sh calls package.sh internally, so this produces the .app, the
      # .pkg and the .dmg in one pass, and with NOTARIZE=1 notarizes and staples
      # both installers.
      - name: Build .app, .pkg and .dmg
        id: build
        env:
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_ID" ]; then
            export NOTARIZE=1
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No Apple signing secrets; this release is ad-hoc signed."
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi
          bash scripts/build-dmg.sh "${{ steps.v.outputs.version }}"

      - name: Verify the artifacts exist
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          ls -lh "dist/Unduck-${VERSION}.dmg" "dist/Unduck-${VERSION}.pkg"
          # The version baked into the bundle must match the tag, or the updater
          # will never settle.
          BUNDLED="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Unduck.app/Contents/Info.plist)"
          [ "$BUNDLED" = "$VERSION" ] || { echo "::error::bundle says $BUNDLED, expected $VERSION"; exit 1; }

      # Gatekeeper's own verdict on what users will download, not just "the
      # notary service said Accepted".
      - name: Verify Gatekeeper accepts the installers
        if: steps.build.outputs.notarized == 'true'
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          xcrun stapler validate "dist/Unduck-${VERSION}.dmg"
          xcrun stapler validate "dist/Unduck-${VERSION}.pkg"
          spctl --assess --type open --context context:primary-signature -v "dist/Unduck-${VERSION}.dmg"
          spctl --assess --type install -v "dist/Unduck-${VERSION}.pkg"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZED: ${{ steps.build.outputs.notarized }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          TAG="${{ steps.v.outputs.tag }}"
          NOTES=$(cat <<'EOF'
          Native arm64 build for macOS 26.1+.

          **Install with Homebrew**

              brew install --cask SidPad03/tap/unduck

          **Or download** `Unduck-VERSION.dmg` below and drag Unduck into Applications.

          SIGNING

          The in-app **Check for Updates…** installs from the `.dmg`; the `.pkg`
          is its fallback.
          EOF
          )
          # Said per build: a release cut before the signing secrets exist is
          # still ad-hoc, and its users do need the workaround.
          if [ "$NOTARIZED" = "true" ]; then
            SIGNING="Signed with a Developer ID and notarized by Apple, so it opens like any other download."
          else
            SIGNING=$(cat <<'EOF'
          The build is ad-hoc signed rather than notarized, so macOS blocks the
          first launch. Right-click **Unduck** in Applications and choose **Open**,
          or run:

              xattr -dr com.apple.quarantine /Applications/Unduck.app
          EOF
          )
          fi
          NOTES="${NOTES//VERSION/$VERSION}"
          NOTES="${NOTES//SIGNING/$SIGNING}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its assets."
            gh release upload "$TAG" \
              "dist/Unduck-${VERSION}.dmg" "dist/Unduck-${VERSION}.pkg" --clobber
          else
            # --target pins the new tag to the commit this run built, not to
            # whatever main has moved on to by now.
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Unduck $TAG" \
              --notes "$NOTES" \
              "dist/Unduck-${VERSION}.dmg" "dist/Unduck-${VERSION}.pkg"
          fi

      # Point the Homebrew cask at the release that just published, so
      # `brew install --cask sidpad03/tap/unduck` never hands out the previous
      # build. Same approach as unified-mcp-gateway's ci.yml: a deploy key on
      # SidPad03/homebrew-tap, private half in HOMEBREW_TAP_SSH_KEY. A deploy key
      # reaches that one repository and nothing else. Skipped without the secret,
      # so a fork still releases.
      - name: Update the Homebrew cask
        if: env.TAP_KEY != ''
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          SHA="$(shasum -a 256 "dist/Unduck-${VERSION}.dmg" | awk '{print $1}')"

          # ssh will not read a key from stdin, so it goes to a file with tight
          # permissions and is removed however this step exits.
          KEYFILE="$(mktemp)"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s\n' "$TAP_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          export GIT_SSH_COMMAND="ssh -i $KEYFILE -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          rm -rf tap
          git clone --depth 1 git@github.com:SidPad03/homebrew-tap.git tap
          cd tap
          CASK="Casks/unduck.rb"

          # Anchored to the start of the line so nothing else version-shaped in
          # the file can be rewritten. BSD sed on the macOS runner: -i takes an
          # explicit (empty) backup suffix.
          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|" "$CASK"
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" "$CASK"
          grep -q "^  version \"${VERSION}\"$" "$CASK" || {
            echo "::error::the cask version was not rewritten"; exit 1; }
          grep -q "^  sha256 \"${SHA}\"$" "$CASK" || {
            echo "::error::the cask sha256 was not rewritten"; exit 1; }

          if git diff --quiet; then
            echo "cask already points at ${VERSION}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "unduck ${VERSION}"
          # The gateway's pipeline pushes to the same tap, so a push can lose a
          # race. Rebase onto whatever landed and try again.
          for attempt in 1 2 3; do
            git push -q && { echo "cask bumped to ${VERSION}"; exit 0; }
            sleep $((attempt * 5))
            git pull -q --rebase
          done
          echo "::error::could not push the cask after 3 attempts"
          exit 1
