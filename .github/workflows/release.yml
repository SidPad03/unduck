name: Release

# Tag a version to publish it:
#
#   echo 0.1.3 > VERSION && git commit -am "Release 0.1.3"
#   git tag v0.1.3 && git push origin main --tags
#
# This builds the .app, .pkg and .dmg on a real macOS runner and attaches the
# .pkg + .dmg to a GitHub Release. The in-app updater reads that release, so the
# tag, the VERSION file and the published assets all have to agree.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.1.3)"
        required: true

permissions:
  contents: write   # required to create the release and upload assets

jobs:
  release:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: VERSION file must match the tag
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          WANT="${{ steps.v.outputs.version }}"
          if [ "$FILE_VERSION" != "$WANT" ]; then
            echo "::error::VERSION file says '$FILE_VERSION' but the tag says '$WANT'."
            echo "::error::They must match, or the app will ship reporting the wrong"
            echo "::error::CFBundleShortVersionString and the updater will loop forever"
            echo "::error::offering an update the user already has."
            exit 1
          fi

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      # build-dmg.sh calls package.sh internally, so this produces the .app, the
      # .pkg and the .dmg in one pass.
      - name: Build .app, .pkg and .dmg
        run: bash scripts/build-dmg.sh "${{ steps.v.outputs.version }}"

      - name: Verify the artifacts exist
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          ls -lh "dist/Unduck-${VERSION}.dmg" "dist/Unduck-${VERSION}.pkg"
          # The version baked into the bundle must match the tag, or the updater
          # will never settle.
          BUNDLED="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Unduck.app/Contents/Info.plist)"
          [ "$BUNDLED" = "$VERSION" ] || { echo "::error::bundle says $BUNDLED, expected $VERSION"; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          TAG="${{ steps.v.outputs.tag }}"
          NOTES=$(cat <<'EOF'
          Native arm64 build for macOS 26.1+.

          **Install with Homebrew**

              brew install --cask SidPad03/tap/unduck

          **Or download** `Unduck-VERSION.dmg` below and drag Unduck into Applications.

          The build is ad-hoc signed rather than notarized, so macOS blocks the
          first launch. Right-click **Unduck** in Applications and choose **Open**,
          or run:

              xattr -dr com.apple.quarantine /Applications/Unduck.app

          The `.pkg` is what the in-app **Check for Updates…** downloads.
          EOF
          )
          NOTES="${NOTES//VERSION/$VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its assets."
            gh release upload "$TAG" \
              "dist/Unduck-${VERSION}.dmg" "dist/Unduck-${VERSION}.pkg" --clobber
          else
            gh release create "$TAG" \
              --title "Unduck $TAG" \
              --notes "$NOTES" \
              "dist/Unduck-${VERSION}.dmg" "dist/Unduck-${VERSION}.pkg"
          fi
