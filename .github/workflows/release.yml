name: Release

# Tag a version to publish it:
#
#   echo 0.1.3 > VERSION && git commit -am "Release 0.1.3"
#   git tag v0.1.3 && git push origin main --tags
#
# This builds the .app, .pkg and .dmg on a real macOS runner and attaches the
# .pkg + .dmg to a GitHub Release. The in-app updater reads that release, so the
# tag, the VERSION file and the published assets all have to agree.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 0.1.3)"
        required: true

permissions:
  contents: write   # required to create the release and upload assets

jobs:
  release:
    runs-on: macos-26
    # Job level so the steps' `if:` can see them; a step's own `env:` is not in
    # scope for that step's `if:`.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_ID: ${{ secrets.APPLE_ID }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: VERSION file must match the tag
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          WANT="${{ steps.v.outputs.version }}"
          if [ "$FILE_VERSION" != "$WANT" ]; then
            echo "::error::VERSION file says '$FILE_VERSION' but the tag says '$WANT'."
            echo "::error::They must match, or the app will ship reporting the wrong"
            echo "::error::CFBundleShortVersionString and the updater will loop forever"
            echo "::error::offering an update the user already has."
            exit 1
          fi

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      # APPLE_CERTIFICATE is a base64 .p12 holding both the Developer ID
      # Application identity (the app, the DMG) and the Developer ID Installer
      # identity (the .pkg). Without it the release is ad-hoc signed as before.
      - name: Import the Developer ID certificates
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/pkgbuild
          # The G2 intermediate that issued both certificates. A runner image is
          # not guaranteed to carry it, and without it codesign cannot build the
          # chain to Apple's root.
          curl -fsSL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v "$KEYCHAIN"

      # build-dmg.sh calls package.sh internally, so this produces the .app, the
      # .pkg and the .dmg in one pass, and with NOTARIZE=1 notarizes and staples
      # both installers.
      - name: Build .app, .pkg and .dmg
        id: build
        env:
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_ID" ]; then
            export NOTARIZE=1
            echo "notarized=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No Apple signing secrets; this release is ad-hoc signed."
            echo "notarized=false" >> "$GITHUB_OUTPUT"
          fi
          bash scripts/build-dmg.sh "${{ steps.v.outputs.version }}"

      - name: Verify the artifacts exist
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          ls -lh "dist/Unduck-${VERSION}.dmg" "dist/Unduck-${VERSION}.pkg"
          # The version baked into the bundle must match the tag, or the updater
          # will never settle.
          BUNDLED="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Unduck.app/Contents/Info.plist)"
          [ "$BUNDLED" = "$VERSION" ] || { echo "::error::bundle says $BUNDLED, expected $VERSION"; exit 1; }

      # Gatekeeper's own verdict on what users will download, not just "the
      # notary service said Accepted".
      - name: Verify Gatekeeper accepts the installers
        if: steps.build.outputs.notarized == 'true'
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          xcrun stapler validate "dist/Unduck-${VERSION}.dmg"
          xcrun stapler validate "dist/Unduck-${VERSION}.pkg"
          spctl --assess --type open --context context:primary-signature -v "dist/Unduck-${VERSION}.dmg"
          spctl --assess --type install -v "dist/Unduck-${VERSION}.pkg"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTARIZED: ${{ steps.build.outputs.notarized }}
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          TAG="${{ steps.v.outputs.tag }}"
          NOTES=$(cat <<'EOF'
          Native arm64 build for macOS 26.1+.

          **Install with Homebrew**

              brew install --cask SidPad03/tap/unduck

          **Or download** `Unduck-VERSION.dmg` below and drag Unduck into Applications.

          SIGNING

          The in-app **Check for Updates…** installs from the `.dmg`; the `.pkg`
          is its fallback.
          EOF
          )
          # Said per build: a release cut before the signing secrets exist is
          # still ad-hoc, and its users do need the workaround.
          if [ "$NOTARIZED" = "true" ]; then
            SIGNING="Signed with a Developer ID and notarized by Apple, so it opens like any other download."
          else
            SIGNING=$(cat <<'EOF'
          The build is ad-hoc signed rather than notarized, so macOS blocks the
          first launch. Right-click **Unduck** in Applications and choose **Open**,
          or run:

              xattr -dr com.apple.quarantine /Applications/Unduck.app
          EOF
          )
          fi
          NOTES="${NOTES//VERSION/$VERSION}"
          NOTES="${NOTES//SIGNING/$SIGNING}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing its assets."
            gh release upload "$TAG" \
              "dist/Unduck-${VERSION}.dmg" "dist/Unduck-${VERSION}.pkg" --clobber
          else
            gh release create "$TAG" \
              --title "Unduck $TAG" \
              --notes "$NOTES" \
              "dist/Unduck-${VERSION}.dmg" "dist/Unduck-${VERSION}.pkg"
          fi
